
name: Generate Violet Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: Nafiasulthana
          outputs: |
            dist/github-snake-violet-dark.svg?palette=github-dark&color_snake=C084FC&color_dots=0B0814,26133D,6D28D9,A855F7,C084FC
            dist/github-snake-violet-light.svg?palette=github-light&color_snake=6D28D9&color_dots=F3E8FF,DDD6FE,C4B5FD,8B5CF6,6D28D9

      - name: Publish snake
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: Update violet snake
