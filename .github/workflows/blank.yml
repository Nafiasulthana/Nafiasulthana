
name: Generate Violet Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: Nafiasulthana
          outputs: |
            
            dist/github-snake-violet-dark.svg?palette=github-dark&color_snake=%23C084FC&color_dots=%23161B22%2C%230E4429%2C%23006D32%2C%2326A641%2C%2339D353
            dist/github-snake-violet-light.svg?palette=github-light&color_snake=%238B5CF6&color_dots=%23EBEDF0%2C%239BE9A8%2C%2340C463%2C%2330A14E%2C%23216E39



      - name: Publish snake
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: Update violet snake
