
name: Generate Violet Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: Nafiasulthana
          outputs: |
            dist/github-snake-violet-dark.svg?palette=github-dark&color_snake=C084FC
            dist/github-snake-violet-light.svg?palette=github-light&color_snake=A855F7

      - name: Publish snake
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: Update violet snake
