
name: Generate Violet Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: Nafiasulthana
          outputs: |
            dist/github-snake-violet-dark.svg?palette=github-dark&color_snake=C084FC&color_dots=161B22,0E4429,006D32,26A641,39D353
            dist/github-snake-violet-light.svg?palette=github-light&color_snake=8B5CF6&color_dots=EBEDF0,9BE9A8,40C463,30A14E,216E39


      - name: Publish snake
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: Update violet snake
